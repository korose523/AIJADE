name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # the database-backed tests run against the same PostgreSQL image as tools/dev-services.sh; tests that need a model
    # server, a Minecraft server, a desktop or a browser stay opt-in and are reported as skipped
    services:
      postgres:
        image: ghcr.io/tensorchord/vchord-postgres:pg18-v1.0.0
        env:
          POSTGRES_USER: aijade
          POSTGRES_PASSWORD: aijade
          POSTGRES_DB: aijade
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U aijade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AIJADE_TEST_DATABASE_URL: postgres://aijade:aijade@127.0.0.1:55432/aijade
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - name: Check public-reference type and missing-data conventions
        run: python3 -m unittest discover -s experiments/p2-a/reference-oracles/2026-11-10 -p 'test_*.py' -v
      - name: Verify P2-A recovered references and candidate decisions
        run: python3 experiments/p2-a/candidate-review/2026-11-11/verify_archive.py
      - name: Verify complete P2-A executable-bank records and prompt measurements
        run: python3 experiments/p2-a/executable-bank/2026-11-11/verify_archive.py
      - name: Verify complete P2-A tokenizer streams and capacity ledger without model inference
        run: python3 experiments/p2-a/tokenizer-capacity/2026-11-11/verify_archive.py
      - name: Verify P2-A bounded input choices, complete streams and actual request-guard controls
        run: python3 experiments/p2-a/bounded-input/2026-11-11/verify_archive.py
      - name: Verify matched P2 input exposure and both stopped whole-task calibration attempts
        run: python3 experiments/p2-a/judgment-alignment/2026-11-11/verify_archive.py
      - name: Verify complete LongMemEval eligibility, populations and actual delivery records
        run: python3 experiments/p3-longmemeval/2026-11-11/verify_archive.py
      - name: Verify Chapter 7 complete staged development qualification and retained failed attempt
        run: python3 experiments/ch7/2026-11-12/verify_archive.py
