name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # the database-backed tests run against the same PostgreSQL image as tools/dev-services.sh; tests that need a model
    # server, a Minecraft server, a desktop or a browser stay opt-in and are reported as skipped
    services:
      postgres:
        image: ghcr.io/tensorchord/vchord-postgres:pg18-v1.0.0
        env:
          POSTGRES_USER: aijade
          POSTGRES_PASSWORD: aijade
          POSTGRES_DB: aijade
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U aijade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AIJADE_TEST_DATABASE_URL: postgres://aijade:aijade@127.0.0.1:55432/aijade
    steps:
      - uses: actions/checkout@v7
      - name: Verify browser stage mount ownership and cleanup
        run: node --test tests/Aijade.E2E/browser-stage-ownership.test.mjs
      - name: Verify browser soak duration and sampling boundaries
        run: node --test tests/Aijade.E2E/browser-soak-clock.test.mjs
      - name: Match the Mac observer AST and source-control toolchain
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - name: Verify offline P2-R qualification worklist and captured records
        run: python3 -B -m unittest discover -s experiments/rq-c -p test_prepare_department_regeneration.py -v
      - name: Verify offline Chapter 7 worklist and repeat delivery
        run: |
          set -o pipefail
          mkdir -p .runtime/ch7-preparation
          python3 -B experiments/ch7/test_prepare_known_repeats.py .runtime/ch7-preparation | cmp - experiments/ch7/mac-known-repeats-preparation/offline-controls.json
      - name: Verify offline P2-R launch and continuous log evidence
        run: python3 -B -m unittest discover -s experiments/rq-c -p test_launch_department_regeneration.py -v
      - name: Verify offline Chapter 7 two-repeat launcher
        run: python3 -B -m unittest discover -s experiments/ch7 -p test_launch_known_repeats.py -v
      - name: Verify offline Chapter 7 qualification and construction binding
        run: python3 -B -m unittest discover -s experiments/ch7 -p test_known_repeat_acceptance.py -v
      - name: Verify offline Chapter 7 canonical build freeze
        run: python3 -B -m unittest discover -s experiments/ch7 -p test_freeze_known_repeat_build.py -v
      - name: Verify offline Chapter 7 measurement audit policy binding
        run: python3 -B -m unittest discover -s experiments/ch7 -p test_heldout_audit_route.py -v
      - name: Verify offline Chapter 7 four-block qualification to measurement
        run: python3 -B -m unittest discover -s experiments/ch7 -p test_four_block_end_to_end.py -v
      - name: Verify offline P2-R read-only departmental log collector
        run: python3 -B -m unittest discover -s experiments/rq-c -p test_collect_department_journal.py -v
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - name: Verify independently owned capabilities and reject external project coupling
        run: python3 -B tools/verify-independent-architecture.py --self-test
      - name: Verify native local voice protocol, cancellation and cleanup
        run: python3 -B -m unittest discover -s tools/companion-services -p 'test_*.py' -v
      - name: Verify project-local paths and companion launch arguments
        run: python3 tests/shell/verify_workspace_env.py
      - name: Verify finite binary identity, bounded owned cleanup and terminal receipts
        run: |
          python3 -m venv .runtime/finite-control-env
          .runtime/finite-control-env/bin/python -m pip install psutil==7.2.2
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_finite_runtime.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_finite_block_lifecycle.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_finite_lifecycle_integration.py' -v
      - name: Fetch original prefix-engineering refusal and prior passport source objects
        run: git fetch --no-tags --depth=1 origin b5af85f7a1b5f1da3ceeda0a9c1a64393a0e3efb bb2c25b808c1c3f604e081b5fa4da4d4f76af84d
      - name: Replay retained prefix-engineering refusal with coherent semantic controls
        run: |
          .runtime/finite-control-env/bin/python -B experiments/ch7/mac-prefix-2026-11-17/engineering-attempt-01/verify_archive.py --repo . --output .runtime/mac-prefix-refusal/report.json --temp-root .runtime/mac-prefix-refusal/disposable --controls
      - name: Verify complete P4 refusal records and adversarial controls without Mac services
        run: |
          git fetch --no-tags --depth=1 origin 147564c9db812c1a9e5ae07992d9aa282399a310 8acfa99d061f1c41197fac2a1c243b3b347bcfef 42fc728ade94c60b0d24575b9510b69dd2048676 5d020ccbf54c16965b4a1fe3467b3d8d726d23f8
          .runtime/finite-control-env/bin/python -B experiments/ch7/mac-prefix-v4-2026-11-17/qualification-attempt-01/verify_archive.py --repo . --controls
      - name: Verify prospective Mac process, version and complete-sequence controls without live services
        env:
          AIJADE_E4_AUDIT_SOURCE: "${{ github.workspace }}/experiments/ch7/nested-copy-2026-11-18/engineering-attempt-02/packet/source/experiments/ch7/audit_nested_load.py"
        run: |
          .runtime/finite-control-env/bin/python -B -c 'import hashlib, os; from pathlib import Path; p = Path(os.environ["AIJADE_E4_AUDIT_SOURCE"]); assert hashlib.sha256(p.read_bytes()).hexdigest() == "11d5f3bce77ed0f7120d136dc734bc29acf45761877b03404cabc6a81cd7b5c7"; print("Version scope: unchanged E4 tests use exact frozen11d5 audit; new owned tests use current source")'
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_segmented_capture.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_measured_mac_monitor.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_full_state_clone_cursor.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_clone_cursor_glue.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_owned_guard_cursor.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s experiments/ch7/owned-state-2026-11-18/freeze -p 'test_*launcher*.py' -v
          .runtime/finite-control-env/bin/python -B tests/shell/run_versioned_nested_controls.py
          .runtime/finite-control-env/bin/python -B tests/shell/run_versioned_mac_controls.py
          .runtime/finite-control-env/bin/python -B experiments/ch7/nested-load-2026-11-17/engineering-attempt-01/post-terminal-controls/verify_e3_packet.py --packet "$GITHUB_WORKSPACE/experiments/ch7/nested-load-2026-11-17/engineering-attempt-01/packet"
          .runtime/finite-control-env/bin/python -B experiments/ch7/nested-copy-2026-11-18/engineering-attempt-02/packet/archive-tools/verify_e4_packet.py --packet "$GITHUB_WORKSPACE/experiments/ch7/nested-copy-2026-11-18/engineering-attempt-02/packet"
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_process_lifecycle*.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_binary_authentication.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_binary_c_compare.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_phase_continuity*.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_lifecycle_*.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_finite_sequence_audit.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_finite_corruption_baselines.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_frozen_launcher.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_frozen_sequence_parent.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_prefix_construction_binding.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_prefix_backend_preflight.py' -v
      - name: Verify retained E5 refusal packet and exact recorded fifteen adverse controls
        run: |
          .runtime/finite-control-env/bin/python -B experiments/ch7/owned-state-2026-11-18/engineering-attempt-03/post-terminal-controls/verify_e5_packet.py --packet "$GITHUB_WORKSPACE/experiments/ch7/owned-state-2026-11-18/engineering-attempt-03/packet"
          .runtime/finite-control-env/bin/python -B tests/shell/versioned_nested_scope.py --repo . --verify-companions
      - name: Verify complete retained E6 Native refusal without live services
        run: |
          .runtime/finite-control-env/bin/python -B experiments/ch7/native-ready-2026-11-18/engineering-attempt-04/packet/archive-tools/verify_e6_packet.py --packet experiments/ch7/native-ready-2026-11-18/engineering-attempt-04/packet
          .runtime/finite-control-env/bin/python -B experiments/ch7/native-ready-2026-11-18/engineering-attempt-04/post-terminal-controls/verify_e6_recorded_controls.py --packet experiments/ch7/native-ready-2026-11-18/engineering-attempt-04/packet
      - name: Verify native READY, full listener transcripts and current independent native audit controls
        run: |
          .runtime/finite-control-env/bin/python -B -c 'import shutil; assert shutil.which("cc"), "Native source controls require an available C compiler; skipping them is not acceptance"'
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_native_integration.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_listener_evidence.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_native_exec_registry.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s tests/shell -p 'test_native_audit.py' -v
          .runtime/finite-control-env/bin/python -B -m unittest discover -s experiments/ch7/native-ready-2026-11-18/freeze -p 'test_*launcher*.py' -v
      - name: Check finite-comparison adverse scoring and independent raw aggregation
        run: python3 experiments/ch7/finite_scoring_controls.py
      - name: Check two-repeat decision matching on retained and synthetic cases
        run: |
          mkdir -p .runtime/ch7-repeat-controls
          python3 -B experiments/ch7/test_compare_known_repeats.py .runtime/ch7-repeat-controls
      - name: Reject incomplete or non-equivalent P2 regeneration comparisons
        run: python3 -B -m unittest discover -s experiments/rq-c -p 'test_regen_compare_v2.py' -v
      - name: Recompute the archived LangChain access-refresh transitions
        run: |
          set -o pipefail
          study=experiments/p3-policy/2026-11-10
          python3 -B "$study/audit_langchain_access_refresh.py" | cmp - "$study/langchain-access-refresh-transitions.json"
      - name: Check public-reference type and missing-data conventions
        run: python3 -m unittest discover -s experiments/p2-a/reference-oracles/2026-11-10 -p 'test_*.py' -v
      - name: Verify P2-A recovered references and candidate decisions
        run: python3 experiments/p2-a/candidate-review/2026-11-11/verify_archive.py
      - name: Verify complete P2-A executable-bank records and prompt measurements
        run: python3 experiments/p2-a/executable-bank/2026-11-11/verify_archive.py
      - name: Verify complete P2-A tokenizer streams and capacity ledger without model inference
        run: python3 experiments/p2-a/tokenizer-capacity/2026-11-11/verify_archive.py
      - name: Verify P2-A bounded input choices, complete streams and actual request-guard controls
        run: python3 experiments/p2-a/bounded-input/2026-11-11/verify_archive.py
      - name: Verify matched P2 input exposure and both stopped whole-task calibration attempts
        run: python3 experiments/p2-a/judgment-alignment/2026-11-11/verify_archive.py
      - name: Verify complete LongMemEval eligibility, populations and actual delivery records
        run: python3 experiments/p3-longmemeval/2026-11-11/verify_archive.py
      - name: Verify Chapter 7 complete staged development qualification and retained failed attempt
        run: python3 experiments/ch7/2026-11-12/verify_archive.py
      - name: Verify retrieval-led development chronology, database continuity and both attempts
        run: python3 experiments/ch7/retrieval-led-2026-11-12/verify_archive.py
      - name: Verify paired known-case baseline, immutable scoring and post-measurement audit correction
        run: python3 experiments/ch7/paired-development-2026-11-12/verify_archive.py
      - name: Materialize the immutable research snapshot before product evolution
        uses: actions/checkout@v7
        with:
          ref: f90f04110f46fb17a2a43a777ed5d4e68a361902
          path: .runtime/historical-manifest
          persist-credentials: false
      - name: Verify unchanged historical packet and pinned source without qualifying current product code
        run: python3 -B tools/verify-historical-manifest.py --snapshot .runtime/historical-manifest
      - name: Verify conditional live manifest dataflow, retained swap stop and fixed idle admission
        run: python3 experiments/ch7/live-manifest-2026-11-12/verify_archive.py
      - name: Verify authored source and embedded build revision are distinguished
        run: python3 experiments/ch7/verify_live_build_provenance.py
      - name: Verify known-case persisted acts, separate second rendering and complete dispositions
        run: python3 experiments/ch7/round2-render-2026-11-12/verify_archive.py
      - name: Verify full controlled history, recorder timing and candidate-to-prompt evidence
        run: python3 experiments/p3-history/2026-11-12/verify_archive.py
      - name: Verify finite-driver instrument checks and both refused admission windows
        run: python3 experiments/ch7/finite-readiness-2026-11-16/verify_archive.py --controls
      - name: Verify relocated runtime preparation, retained failures and one process-refused admission
        run: python3 -B experiments/ch7/relocated-runtime-2026-11-16/verify_archive.py --controls
      - name: Materialize exact Mac qualification implementation for offline refusal replay
        uses: actions/checkout@v7
        with:
          ref: fe0fa07c655224fdeed32556cd31ce4022126037
          path: .runtime/ch7-mac-formal-source
          persist-credentials: false
      - name: Fetch the original public plan and binary-publication objects
        run: git -C .runtime/ch7-mac-formal-source fetch --no-tags --depth=1 origin 795b23d7e69a8b59396b84199bd7429451ecbb4f 0c3f3cc922e940c97628837476946526659d936e
      - name: Replay complete retained Mac refusal and coherent adversarial controls without live services
        run: python3 -B experiments/ch7/mac-formal-2026-11-16/verify_archive.py --root experiments/ch7/mac-formal-2026-11-16/packet --repo .runtime/ch7-mac-formal-source --controls
      - name: Materialize actual bulk-census implementation for terminal-record replay
        uses: actions/checkout@v7
        with:
          ref: d96152b98f61e3cb47db9ec3d95e00591830d024
          path: .runtime/ch7-mac-bulk-source
          persist-credentials: false
      - name: Fetch frozen bulk-census plan, build and historical objects
        run: git -C .runtime/ch7-mac-bulk-source fetch --no-tags --depth=1 origin d96152b98f61e3cb47db9ec3d95e00591830d024 a20f090423548dedbf1337ec50786daa9e2d028a 82cfaa2fd4ff7810cab09012829e5b8d7a2c82c9 3e37a85b5bb39669782543fc7197d73eecf2dc1f 2d52777bc6b34fd8c6410800f0c56268d8132301
      - name: Replay complete bulk terminal record and coherent corruption controls
        run: |
          mkdir -p .runtime/mac-bulk-refusal
          python3 -B experiments/ch7/mac-census-2026-11-16/audit.py --root experiments/ch7/mac-census-2026-11-16/packet --repo .runtime/ch7-mac-bulk-source --output .runtime/mac-bulk-refusal/audit.json
          python3 -B experiments/ch7/mac-census-2026-11-16/refusal_negative_controls.py --root experiments/ch7/mac-census-2026-11-16/packet --repo .runtime/ch7-mac-bulk-source --output .runtime/mac-bulk-refusal/controls.json --temp-root .runtime/mac-bulk-refusal/disposable
      - name: Materialize exact typed-lifecycle implementation for offline terminal replay
        uses: actions/checkout@v7
        with:
          ref: 0c42cc29c64730131466af6b079a900005713cba
          path: .runtime/ch7-mac-lifecycle-source
          persist-credentials: false
      - name: Fetch frozen lifecycle plan and binary publication
        run: git -C .runtime/ch7-mac-lifecycle-source fetch --no-tags --depth=1 origin 9f3a5ead4ca63f489399907fe2e2a8d2aecbab68 efbcfa0196cbc69bd24cad5b03f01b5078898b7b
      - name: Replay all lifecycle terminal evidence and twelve coherent archive corruptions
        run: |
          .runtime/finite-control-env/bin/python -B experiments/ch7/mac-lifecycle-2026-11-17/refusal_negative_controls.py --root experiments/ch7/mac-lifecycle-2026-11-17/packet --repo .runtime/ch7-mac-lifecycle-source --output .runtime/mac-lifecycle-refusal-controls
