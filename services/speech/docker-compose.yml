# Local self-hosted speech stack for AIJADE.
#   - SenseVoice ASR  (OpenAI-compatible transcriptions, returns emotion)
#   - IndexTTS2 TTS   (OpenAI-compatible speech, emo_text / voice_audio)
#   - CosyVoice-local (optional, Instruct emotion path)
#
# Requires an NVIDIA GPU. Adjust the IndexTTS2 mount to your local checkout.
version: '3.9'

services:
  sensevoice-asr:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - '8000:8000'
    command: python sensevoice_asr_server.py --port 8000 --device cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  index-tts:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      # Adjust this to your local IndexTTS2 checkout
      - /mnt/d/项目/index-tts:/app
    ports:
      - '8765:8765'
    command: python tts_server.py --port 8765 --device cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  cosyvoice-local:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - /mnt/d/项目/cosyvoice:/app
    ports:
      - '9000:9000'
    command: python examples/llm/api_server.py --port 9000 --device cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
